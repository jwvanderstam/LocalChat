server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SSE requires buffering off so tokens stream immediately
    proxy_buffering off;

    # Must match the application's MAX_CONTENT_LENGTH (16 MB by default). nginx's
    # own default is 1 MB, so without this an upload the application would accept
    # is refused by the proxy with a 413 the application never sees — and raising
    # the application's limit alone would silently do nothing behind this proxy.
    client_max_body_size 16m;

    # The application sets these on every response it produces (src/security_fastapi.py).
    # Repeated here because nginx answers some responses itself — a 413 for a body over
    # the limit above, a 502 when the app is down, its own error pages — and those never
    # reach the application's middleware. `always` is what makes them apply to error
    # responses rather than only 2xx/3xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Set here rather than in the app for these responses: nginx is what terminates TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the latter *appends* the peer
        # to whatever the caller already sent, so a request carrying its own
        # X-Forwarded-For arrives as "<forged>, <real>". The app then keys its rate
        # limit on an attacker-chosen value and login brute force is unthrottled.
        # Replacing the header discards anything the caller sent, which is correct
        # while this nginx is the edge. Put another proxy in front of it and this
        # line has to become $proxy_add_x_forwarded_for again, with that proxy's
        # address added to TRUSTED_PROXY_IPS.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow long-running SSE connections
        proxy_read_timeout 300s;
    }
}
