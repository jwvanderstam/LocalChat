# SonarCloud project configuration
# https://sonarcloud.io

sonar.projectKey=jwvanderstam_LocalChat
sonar.organization=jwvanderstam
sonar.projectName=LocalChat
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=src
sonar.tests=tests

# Python version
sonar.python.version=3.12

# Coverage report (generated by pytest --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions - non-application code and vendored third-party assets
sonar.exclusions=\
  static/css/bootstrap.min.css,\
  static/css/bootstrap-icons.css,\
  static/css/fonts/**,\
  static/js/bootstrap.bundle.min.js,\
  static/vendor/**,\
  templates/**,\
  uploads/**,\
  htmlcov/**,\
  env/**,\
  .venv/**

# Coverage counts every source file (QP-6). src/db/ used to be excluded, eleven files of
# it, because the unit suite has no database and those mixins are exercised by the
# integration suite; the number SonarCloud showed therefore left out the code that
# matters most for isolation. The SonarCloud workflow now runs both suites against a
# Postgres service and combines them, so nothing needs hiding.
sonar.coverage.exclusions=\
  tests/**

# Encoding
sonar.sourceEncoding=UTF-8
