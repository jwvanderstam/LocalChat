# SonarCloud project configuration
# https://sonarcloud.io

sonar.projectKey=jwvanderstam_LocalChat
sonar.organization=jwvanderstam
sonar.projectName=LocalChat
sonar.projectVersion=1.0.0

# Source and test paths
sonar.sources=src
sonar.tests=tests

# Python version
sonar.python.version=3.12

# Coverage report (generated by pytest --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions - non-application code and vendored third-party assets
sonar.exclusions=\
  static/css/bootstrap.min.css,\
  static/css/bootstrap-icons.css,\
  static/css/fonts/**,\
  static/js/bootstrap.bundle.min.js,\
  templates/**,\
  uploads/**,\
  htmlcov/**,\
  env/**,\
  .venv/**

# Test exclusions from main source analysis
# Most src/db/ mixins require a live PostgreSQL instance and are covered by
# integration tests (@pytest.mark.db), not the fast unit suite — excluded so
# that requirement doesn't drag down the reported coverage number. documents.py
# is the exception: tests/unit/test_db_operations.py and test_db.py exercise it
# extensively via mocked connections, no live DB needed, so it's measured like
# any other unit-tested module — deliberately not blanket-excluded just because
# it lives in the same directory as files that do need one.
sonar.coverage.exclusions=\
  tests/**,\
  app.py,\
  src/db/__init__.py,\
  src/db/annotations.py,\
  src/db/connection.py,\
  src/db/connectors.py,\
  src/db/conversations.py,\
  src/db/entities.py,\
  src/db/feedback.py,\
  src/db/memories.py,\
  src/db/oauth_tokens.py,\
  src/db/tokens.py,\
  src/db/users.py,\
  src/db/workspaces.py

# Encoding
sonar.sourceEncoding=UTF-8
