# TLS termination overlay — use with: docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
#
# Prerequisites:
#   1. Edit nginx/nginx.conf: replace YOUR_DOMAIN with your actual domain.
#   2. Place your certificate files in ./nginx/certs/:
#        fullchain.pem  — full certificate chain
#        privkey.pem    — private key
#      (e.g. from Let's Encrypt: copy from /etc/letsencrypt/live/<domain>/)
#
# The app service is NOT exposed on 5000 when this overlay is active —
# all traffic enters via Nginx on 80/443.

services:
  app:
    ports: !reset []  # remove direct port exposure; Nginx is the only ingress
    environment:
      # Nginx sets X-Forwarded-For (nginx/nginx.conf); this is what makes the app
      # believe it. Without it every request keys on the nginx container's bridge
      # address instead of the caller's, so RATELIMIT_LOGIN stops being per-source
      # and becomes one shared budget for the whole deployment.
      #
      # The proxy's subnet, not "*". With "*" uvicorn's ProxyHeadersMiddleware
      # takes the *leftmost* X-Forwarded-For entry and trusts any peer, so a caller
      # that sent its own header chose its own rate-limit key — login brute force
      # was unthrottled on the public path. Naming the subnet makes uvicorn walk
      # the list from the right and stop at the first address it does not trust,
      # which is the one nginx observed.
      #
      # The previous note here argued this was safe because nginx is the sole
      # ingress and nothing on the compose network could forge the header. That
      # was the wrong threat: the header is forged by the external client, and
      # nginx passed it straight through.
      TRUSTED_PROXY_IPS: "172.31.240.0/24"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    # Without this nginx joins the implicit `default` network while app is on
    # frontend/backend, so `proxy_pass http://app:5000` cannot resolve and the
    # overlay never reached the application at all. Found while fixing the header.
    networks:
      - frontend

networks:
  # A fixed subnet so TRUSTED_PROXY_IPS can name it. Docker assigns bridge subnets
  # dynamically otherwise, and the app cannot be configured to trust an address
  # that is not known until it starts.
  frontend:
    ipam:
      config:
        - subnet: 172.31.240.0/24
