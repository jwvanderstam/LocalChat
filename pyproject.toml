[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# S101 only, not the whole flake8-bandit set: `bandit` itself runs in CI and owns
# that job. This one rule is here because `python -O` strips `assert`, so an
# invariant written that way is not enforced by the interpreter that ships (P2-4a).
#
# BLE001 (P2-4b): `except Exception` must be argued, not reached for. Every
# suppression in src/ names what degrades and to what — a bare `# noqa: BLE001`
# is the thing this rule exists to prevent, so it does not count as compliance.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S101", "BLE001"]
ignore = [
    "E501",    # line-too-long — enforced by reviewer judgment, not tooling
    "E402",    # module-import-not-at-top — intentional in several modules
    "F811",    # redefined-while-unused — conditional import pattern (TYPE_CHECKING guards)
    "SIM105",  # suppressible-exception — explicit `except/pass` is intentional in places
    "SIM117",  # multiple-with-statements — readability preference; nested is clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001"]  # assert is the point here, and a test that catches
                                 # broadly to prove a failure path risks nothing in production
"scripts/**" = ["BLE001"]        # operational one-shots run by a human at a terminal: catching
                                 # broadly to print a diagnostic and exit non-zero is the job

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, require services)",
    "e2e: End-to-end tests driving a real browser (require Playwright and PostgreSQL)",
    "slow: Slow tests (> 1 second)",
    "db: Tests requiring database",
    "ollama: Tests requiring Ollama service",
    "rag: Tests for RAG functionality",
    "api: Tests for API endpoints",
    "validation: Tests for input validation",
    "sanitization: Tests for input sanitization",
    "exceptions: Tests for exception classes",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["."]
relative_files = true
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "setup.py",
    "test_*.py",
    "conftest.py",
]

[tool.coverage.report]
precision = 2
relative_files = true
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.bandit]
# B104: web_search and Uvicorn intentionally bind to 0.0.0.0
# B608 is not skipped (audit QP-2): each SQL string built with interpolation carries
# `# nosec B608  # <why it is safe>` on its last line (the second `#` keeps bandit
# from reading the reason as test ids), so a new one fails CI until read.
skips = ["B104"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# QP-3 (ROADMAP Initiative 12, ADR-7): the layering, as contracts `lint-imports` checks.
# Higher layers may import lower ones, never the reverse. The ignore_imports lists are
# today's violations, recorded so the contracts can run in CI before the code obeys
# them: each QP-4 PR removes its own lines, and none may be added. QP-5 empties them.
[tool.mypy]
# CI runs `mypy src --ignore-missing-imports`. Modules QP-4 has moved to repositories
# and services are held to strict typing from the PR that creates them (ROADMAP QP-4).
[[tool.mypy.overrides]]
module = [
    "src.db.users",
    "src.db.tokens",
    "src.db.documents",
    "src.db.workspaces",
    "src.db.workspace_keys",
    "src.services.documents",
    "src.services.errors",
    "src.services.passwords",
    "src.services.users",
    "src.services.workspaces",
    "src.routes_fastapi._services",
]
# `strict = true` is global-only; these are the per-module flags it turns on.
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Routes never reach the database layer directly"
type = "forbidden"
source_modules = ["src.routes_fastapi"]
forbidden_modules = ["src.db"]
# Direct imports only: a route reaching the database through a service is the layering
# working, not a breach of it.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Routes above services above the database layer"
type = "layers"
layers = ["src.routes_fastapi", "src.services", "src.db"]
