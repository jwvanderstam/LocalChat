version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "jwvanderstam"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Collapses routine bumps so open-pull-requests-limit stops binding and
      # never silently suppresses an update. Majors stay ungrouped — those are
      # the ones that need a human.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
 
  # GitHub Actions versies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
      - "automated"
    # init/autobuild/analyze must run the same version — a workflow left on
    # mixed versions fails with "Loaded a configuration file for version X,
    # but running version Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"