version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "jwvanderstam"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # onnxruntime 1.29.0 segfaults on import inside the hardened runtime base:
      # the image builds and publishes cleanly, then dies with exit 139 and no
      # traceback. That is the exact failure docker-smoke was built to catch
      # (LESSONS_LEARNED Ch. 17), and it caught this bump in #305 — where it was
      # riding in a group with three harmless updates that could not land while
      # it was there.
      #
      # Pinned to the single bad version, not the 1.29 line: 1.29.0 is currently
      # the latest release, so a 1.29.1 will still be proposed and should be
      # tried. Remove this entry once one imports in the image.
      - dependency-name: "onnxruntime"
        versions: ["1.29.0"]

      # litellm >=1.98.0 hard-depends on boto3, which puts the AWS SDK into the
      # image of a sovereignty-scoped appliance to reach a Bedrock endpoint we
      # will never call. The hold is a standing decision recorded in ADR-4 and
      # in requirements.in next to the pin; without this entry Dependabot
      # re-proposes the bump every week and it fails the same unit test each
      # time: #347 forced ADR-4, and #365 proposed the same bump again. Both
      # died on the same unit test — boto3 present, so the S3 connector's
      # graceful-degradation branch stops raising. Drop the entry when the
      # direct OpenAI-compatible client ADR-4 specifies has landed, not to
      # make a red run go green.
      - dependency-name: "litellm"
        versions: [">=1.98.0"]
    groups:
      # Collapses routine bumps so open-pull-requests-limit stops binding and
      # never silently suppresses an update. Majors stay ungrouped — those are
      # the ones that need a human.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
 
  # GitHub Actions versies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
      - "automated"
    # init/autobuild/analyze must run the same version — a workflow left on
    # mixed versions fails with "Loaded a configuration file for version X,
    # but running version Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"