version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "jwvanderstam"
    labels:
      - "dependencies"
      - "automated"
    # These sort to adjacent lines in requirements.lock.txt, so separate PRs
    # conflict with each other as soon as one merges.
    groups:
      nvidia-cuda:
        patterns:
          - "nvidia-*"
          - "cuda-*"
    commit-message:
      prefix: "deps"
      include: "scope"
 
  # GitHub Actions versies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
      - "automated"
    # init/autobuild/analyze must run the same version — a workflow left on
    # mixed versions fails with "Loaded a configuration file for version X,
    # but running version Y".
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    commit-message:
      prefix: "ci"