name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  # Shared across both jobs — keeps env vars DRY
  PG_HOST: localhost
  PG_PORT: 5432
  PG_USER: postgres
  PG_PASSWORD: ci_test_password
  PG_DB: rag_db
  SECRET_KEY: ci-test-secret-key-32chars-minimum
  JWT_SECRET_KEY: ci-test-jwt-secret-key
  ADMIN_PASSWORD: ci-test-admin-password
  OLLAMA_BASE_URL: http://localhost:11434
  APP_ENV: development

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src --ignore-missing-imports

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -q -c pyproject.toml

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          # PYSEC-2026-1325: ecdsa timing side-channel, no upstream fix.
          # This app hardcodes HS256 (src/security_fastapi.py _ALGORITHM)
          # and passes algorithms=["HS256"] to jwt.decode(), so the
          # vulnerable ECDSA path is unreachable. See SECURITY.md.
          # All other CVEs still fail this step.
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      # pip-audit only reports CVEs. This reports plain version drift, which
      # Dependabot's open-pull-requests-limit can silently suppress — an
      # update with no PR was previously invisible. Never fails the build.
      - name: Dependency drift report
        if: always()
        run: |
          pip list --outdated --format=json > outdated.json || echo '[]' > outdated.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          pkgs = json.load(open("outdated.json"))
          def breaking(p):
              cur, new = p["version"].split("."), p["latest_version"].split(".")
              if cur[0] != new[0]:
                  return True
              # Under semver a 0.x minor bump is the breaking one.
              return cur[0] == "0" and cur[1:2] != new[1:2]
          majors = sorted((p for p in pkgs if breaking(p)), key=lambda p: p["name"])
          print("### Dependency drift")
          print()
          print(f"{len(pkgs)} outdated, **{len(majors)} major**")
          if majors:
              print()
              print("| Package | Current | Latest |")
              print("|---|---|---|")
              for p in majors:
                  print(f"| `{p['name']}` | {p['version']} | {p['latest_version']} |")
          PY

      - name: Run unit tests
        shell: bash
        run: pytest tests/unit/ -v --tb=short -x -rs | tee unit-output.txt

      # A skipped test reports as success. That is how ten tests patching a
      # module layout deleted in the src-layout migration, and eighteen skipped
      # for a Windows-only reason on Linux runners, stayed green for months.
      # Reasons go to the job summary so the next one is noticed in days.
      - name: Skip census
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import collections, pathlib, re
          text = pathlib.Path("unit-output.txt").read_text(errors="replace")
          reasons = collections.Counter()
          # Group by reason, not by call site: pytest prefixes each entry with
          # `file.py:line:`, which would list one row per test and bury the shape.
          for line in text.splitlines():
              m = re.match(r"SKIPPED \[(\d+)\] (?:.+?\.py(?::\d+)?: )?(.+)", line.strip())
              if m:
                  reasons[m.group(2)] += int(m.group(1))
          total = sum(reasons.values())
          print("### Skipped tests")
          print()
          print(f"**{total}** skipped in `tests/unit/`" if total else "None — every unit test ran.")
          if reasons:
              print()
              print("| Count | Reason |")
              print("|---|---|")
              for reason, count in reasons.most_common():
                  print(f"| {count} | {reason} |")
              print()
              print("A skip is a test that did not verify anything. Each line is a claim to re-check.")
          PY

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests  # skip if unit tests already fail

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Rate limiting is a security control — RATELIMIT_LOGIN is the defence
      # against password guessing — and its Redis-backed behaviour skipped in CI
      # for want of this service. Same image as docker-compose.yml.
      # The app's limiter only reaches this once RATELIMIT_STORAGE_URI is passed
      # to Limiter() (SEC-3); before that it kept private in-process counters.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Redis rate-limit tests skip themselves when the server is absent, so
      # a broken service would restore the silence rather than fail. Fail here.
      - name: Redis is reachable
        run: |
          python - <<'PY'
          import sys, redis
          try:
              redis.Redis(host="localhost", port=6379, socket_connect_timeout=5).ping()
          except Exception as exc:
              sys.exit(f"::error::Redis unreachable — the rate-limit tests would skip: {exc}")
          print("OK: Redis reachable")
          PY

      - name: Run integration tests
        run: pytest tests/integration/ -m "not ollama" -v --tb=short

  # TQ-4. Deliberately not in the "Code Verification" ruleset: a browser test is
  # the one job whose flake would block every merge, and the golden path it covers
  # is proven by integration-tests at the service layer regardless. Promote it to
  # required once it has a run history to justify that.
  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The package is a declared dependency; the browser binary is not, and no
      # wheel carries it.
      - name: Install Chromium
        run: playwright install --with-deps chromium

      # --no-cov: the application runs in a subprocess the coverage plugin does not
      # see, so the number it would report here is noise.
      - name: Run end-to-end tests
        run: pytest tests/e2e/ -v --tb=short --no-cov

  # PERF-2's canary: a /api/health probe polled while concurrent SSE streams run.
  # It is the one metric that sees a blocked event loop — time-to-first-token is
  # dominated by the queue at the model, and three runs of one build spread wider
  # than the fix PERF-1 made. Deliberately not in the required set until several
  # runs have shown the spread on a runner; its ceiling is loose by design until
  # then, and every run prints the observed numbers.
  perf-canary:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -s so the measured numbers reach the log: this job exists to report them,
      # not only to pass. --no-cov for the same reason e2e skips it — the server
      # runs in a subprocess the coverage plugin never sees.
      - name: Measure event-loop responsiveness under load
        run: pytest tests/perf/ -v --tb=short --no-cov -s

  # OPS-4 / exit criterion 5. OPERATIONS.md documents a backup and a
  # pgvector-safe restore, and an untested restore procedure is a wish. This runs
  # it: seed the real schema, dump, restore into a fresh database, and prove the
  # embeddings still answer a similarity query on the other side.
  #
  # It also asserts the warning the runbook leads with — that a restore into a
  # database without the vector extension fails. A documented gotcha nobody has
  # reproduced is just as untrustworthy as an unverified happy path, and if
  # pgvector ever makes that restore succeed, the doc should stop saying it does
  # not.
  #
  # Scope, honestly: this proves the SQL-level procedure. OPERATIONS.md wraps the
  # same commands in `docker compose exec db`, which a service container cannot
  # reproduce, so the compose invocation itself is still unverified.
  restore-proof:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci_test_password

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The client must match the server, or pg_dump refuses: "server version
      # 16.x, pg_dump version 14.x is not supported".
      - name: Install postgresql-client 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb http|deb [signed-by=/usr/share/keyrings/pgdg.gpg] http|' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      # The application's own schema, not a hand-written stand-in: a restore
      # proof over a table this app never creates proves nothing about this app.
      - name: Create the real schema
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: postgres
          PG_PASSWORD: ci_test_password
          PG_DATABASE: rag_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          APP_ENV: development
        run: |
          python - <<'PY'
          from src.db import db
          ok, message = db.initialize()
          assert ok, message
          from src.app_bootstrap import _run_alembic_migrations
          _run_alembic_migrations()
          print("schema created and migrated")
          PY

      - name: Seed a document and an embedded chunk
        run: |
          psql -d rag_db -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO documents (filename, content)
          VALUES ('restore-proof.txt', 'A document that has to survive a round trip.');

          INSERT INTO document_chunks (document_id, chunk_text, chunk_index, embedding)
          SELECT id,
                 'pgvector stores embeddings beside the chunk text.',
                 0,
                 (SELECT ('[' || string_agg((0.001 * n)::text, ',') || ']')::vector
                  FROM generate_series(1, 768) AS n)
          FROM documents WHERE filename = 'restore-proof.txt';
          SQL
          psql -d rag_db -tAc "SELECT count(*) FROM document_chunks WHERE embedding IS NOT NULL"

      - name: Back up, exactly as OPERATIONS.md says
        run: |
          pg_dump -U postgres -d rag_db --no-password -F c -f /tmp/rag_db.dump
          ls -l /tmp/rag_db.dump

      # The runbook opens with this warning. If it is wrong, the doc is telling
      # operators to do unnecessary work; if it is right, it has to keep saying so.
      # The page used to warn that a restore into a database without the vector
      # extension fails on the embedding column. It does not: pg_dump writes
      # CREATE EXTENSION into the archive. Asserting the true behaviour keeps the
      # doc honest — if a pgvector release ever does make this fail, this step
      # goes red and the page gets corrected rather than quietly becoming wrong.
      - name: A superuser restore needs no pre-created extension
        run: |
          pg_restore -l /tmp/rag_db.dump | grep -qi "EXTENSION - vector" || {
            echo "::error::the dump no longer carries CREATE EXTENSION - OPERATIONS.md needs revisiting"
            exit 1
          }
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rag_db_plain;"
          pg_restore -U postgres -d rag_db_plain --no-password --exit-on-error /tmp/rag_db.dump
          test "$(psql -d rag_db_plain -tAc "SELECT extname FROM pg_extension WHERE extname='vector'")" = "vector"
          echo "OK: the archive brought its own extension"

      - name: Restore, exactly as OPERATIONS.md says
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rag_db_restore;"
          pg_restore -U postgres -d rag_db_restore --no-password --exit-on-error /tmp/rag_db.dump
          echo "OK: restored"

      # The managed-Postgres recipe on the same page: no superuser, so the dump's
      # CREATE EXTENSION, its COMMENT and its OWNER TO all need handling. Each of
      # those failed in turn while working this out; a recipe that stops at the
      # first one is worse than none.
      - name: The managed-Postgres recipe works for a non-superuser
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE restorer LOGIN PASSWORD 'restore_ci';"
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE rag_db_managed OWNER restorer;"
          psql -d rag_db_managed -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=restore_ci pg_restore -U restorer -h localhost -d rag_db_managed             --no-owner --no-comments --exit-on-error /tmp/rag_db.dump
          test "$(psql -d rag_db_managed -tAc 'SELECT count(*) FROM document_chunks WHERE embedding IS NOT NULL')" = "1"
          echo "OK: --no-owner --no-comments carries a non-superuser restore"

      # Row counts prove the rows arrived. Only a similarity query proves the
      # embeddings did — a vector column can restore as the right shape and the
      # wrong numbers, and every count would still match.
      - name: The restored database answers a similarity query
        run: |
          docs=$(psql -d rag_db_restore -tAc "SELECT count(*) FROM documents")
          chunks=$(psql -d rag_db_restore -tAc "SELECT count(*) FROM document_chunks")
          [ "$docs" = "1" ] && [ "$chunks" = "1" ] || {
            echo "::error::row counts differ after restore: documents=$docs chunks=$chunks"
            exit 1
          }

          nearest=$(psql -d rag_db_restore -tAc "
            SELECT chunk_text
            FROM document_chunks
            ORDER BY embedding <=> (SELECT ('[' || string_agg((0.001 * n)::text, ',') || ']')::vector
                                    FROM generate_series(1, 768) AS n)
            LIMIT 1;")
          echo "nearest: $nearest"
          case "$nearest" in
            *"pgvector stores embeddings"*) echo "OK: embeddings survived and rank" ;;
            *) echo "::error::similarity query did not return the seeded chunk"; exit 1 ;;
          esac

  # The hardened runtime base has no shell and no package manager, so a missing
  # system library surfaces as SIGSEGV at import time rather than as a build
  # error: the image builds, then dies with exit 139 and no traceback.
  # onnxruntime 1.29.0 did exactly that. Nothing but booting the container finds
  # it, which is why this job exists and why it is cheap enough to be required —
  # unlike build-and-push, which takes 15-20 min.
  docker-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the image
        run: docker build -t localchat:smoke .

      - name: Runs as the hardened base's nonroot user
        run: |
          uid=$(docker run --rm --entrypoint python localchat:smoke -c "import os; print(os.getuid())")
          if [ "$uid" != "65532" ]; then
            echo "::error::image runs as uid $uid, expected 65532"
            exit 1
          fi
          echo "OK: uid 65532"

      - name: No shell and no package manager
        run: |
          docker run --rm --entrypoint python localchat:smoke -c '
          import shutil, sys
          found = [t for t in ("sh", "bash", "apt-get", "apk") if shutil.which(t)]
          sys.exit("::error::not the hardened runtime variant — found " + ", ".join(found) if found else 0)
          '
          echo "OK: no shell, no package manager"

      - name: No secrets and no test code in the image
        run: |
          docker run --rm --entrypoint python localchat:smoke -c '
          import os, sys
          bad = [p for p in ("/app/.env", "/app/tests", "/app/.git") if os.path.exists(p)]
          sys.exit("::error::must not be in the image: " + ", ".join(bad) if bad else 0)
          '
          echo "OK: no .env, no tests, no .git"

      # The regression guard for the segfault class. These wheels carry their own
      # native libraries; the hardened base cannot install a missing one.
      - name: Native extensions import without a package manager
        run: |
          docker run --rm --entrypoint python localchat:smoke -c '
          import psycopg, onnxruntime, torch, spacy, sentence_transformers
          print("psycopg", psycopg.__version__, "| onnxruntime", onnxruntime.__version__)
          '

      # .dockerignore excluding docs/ or .claude/ would leave the in-app docs
      # viewer serving nothing, with no error anywhere.
      - name: Documents the in-app viewer serves are present
        run: |
          docker run --rm --entrypoint python localchat:smoke -c '
          import os, sys
          from src.docs.service import _CATALOGUE
          missing = [p for _, p in _CATALOGUE if not os.path.exists(os.path.join("/app", p))]
          sys.exit("::error::catalogued docs missing from image: " + ", ".join(missing) if missing else 0)
          '
          echo "OK: every catalogued document is in the image"

      # JWT_SECRET_KEY is a literal rather than the shared env value: that one is 22
      # characters and APP_ENV=production requires 32. ENCRYPTION_KEY is generated
      # per run because APP_ENV=production now refuses to boot without a valid
      # Fernet key (SEC-4) — this job is what proves that refusal is real.
      # No Python suite catches either, because none of them run in production mode.
      # SERVER_PORT is deliberately non-default here: the runtime base has no shell,
      # so the `${SERVER_PORT:-5000}` expansion moved into docker-entrypoint.py. A
      # hardcoded port would pass on 5000 and fail here.
      - name: Generate a Fernet key for the smoke run
        # APP_ENV=production refuses to boot without a valid ENCRYPTION_KEY
        # (SEC-4), so this job needs one. A Fernet key is urlsafe-base64 of 32
        # random bytes, which openssl produces without installing anything.
        # Generated per run so this throwaway never resembles a real secret.
        run: |
          key=$(openssl rand 32 | base64 | tr '+/' '-_')
          echo "SMOKE_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Boot the container and check /api/health
        run: |
          docker run -d --name smoke --network host \
            -e APP_ENV=production \
            -e SERVER_PORT=5050 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e JWT_SECRET_KEY=ci-smoke-jwt-secret-key-32chars-minimum \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e ENCRYPTION_KEY="$SMOKE_ENCRYPTION_KEY" \
            -e PG_HOST=localhost -e PG_PORT=5432 \
            -e PG_USER="$PG_USER" -e PG_PASSWORD="$PG_PASSWORD" -e PG_DB="$PG_DB" \
            -e REDIS_ENABLED=false \
            -e OLLAMA_BASE_URL=http://127.0.0.1:11434 \
            localchat:smoke
          for i in $(seq 1 60); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:5050/api/health || true)
            [ "$code" = "200" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' smoke)" = "exited" ]; then
              echo "::error::container exited with code $(docker inspect -f '{{.State.ExitCode}}' smoke)"
              break
            fi
            sleep 2
          done
          echo "--- container logs ---"
          docker logs smoke 2>&1 | tail -40
          if [ "$code" != "200" ]; then
            echo "::error::/api/health did not return 200 within 120s (last: ${code:-none})"
            exit 1
          fi
          cat /tmp/health.json
          python3 -c "
          import json, sys
          h = json.load(open('/tmp/health.json'))
          if not h['checks']['database']['healthy']:
              sys.exit('::error::database check unhealthy: ' + json.dumps(h))
          print('OK: healthy, database up')
          "

      # The container's own HEALTHCHECK, not just the endpoint. It runs through
      # docker-entrypoint.py, so a healthy verdict also proves the check follows
      # SERVER_PORT rather than hardcoding 5000.
      - name: Docker reports the container healthy
        run: |
          health=""
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$health" = "healthy" ] && break
            [ "$health" = "unhealthy" ] && break
            sleep 2
          done
          status=$(docker inspect -f '{{.State.Status}}' smoke)
          if [ "$status" != "running" ] || [ "$health" != "healthy" ]; then
            echo "::error::container status=$status health=$health"
            docker logs smoke 2>&1 | tail -40
            exit 1
          fi
          echo "OK: running and healthy"

  repo-hygiene:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # needed for commit-message range check

      - name: No native confirm() in the frontend
        # Destructive actions must use window.localchatConfirm, like every other
        # prompt in the app. A native dialog cannot be styled or intercepted, and
        # automation drives it blind -- a QA pass lost a document to exactly that.
        run: |
          if git grep -nE "(^|[^.a-zA-Z])confirm\(" -- 'static/js/*.js' \
               ':!static/js/bootstrap.bundle.min.js' ':!static/js/confirm.js' 2>/dev/null; then
            echo "::error::native confirm() in static/js -- use window.localchatConfirm"
            exit 1
          fi
          echo "OK: no native confirm() in the frontend"

      - name: No emoji as icons in the frontend
        # Icons are drawn SVG, inheriting currentColor and the theme. An emoji
        # renders in the reader's separate colour font instead: a different shape,
        # weight and colour on every platform, at whatever size that font decides.
        # The feedback thumbs and five markers in streaming.js shipped that way and
        # looked wrong beside the rest of the redesigned interface.
        #
        # Arrows and dashes are deliberately not covered: they render in the text
        # font like any other glyph and carry none of that problem.
        run: |
          if git grep -nP "[\x{1F300}-\x{1FAFF}\x{2600}-\x{27BF}]" \n               -- 'static/js/*.js' 'templates/*.html' \n               ':!static/js/bootstrap.bundle.min.js' 2>/dev/null; then
            echo "::error::emoji in the frontend -- draw an inline SVG icon instead"
            exit 1
          fi
          if git grep -nF "\u{1F" -- 'static/js/*.js' 'templates/*.html' \n               ':!static/js/bootstrap.bundle.min.js' 2>/dev/null; then
            echo "::error::escaped emoji codepoint in the frontend -- draw an SVG icon instead"
            exit 1
          fi
          echo "OK: no emoji used as icons"

      - name: No Flask imports in src/
        run: |
          if git grep -El "import flask|from flask" -- src/ 2>/dev/null; then
            echo "::error::Flask imports found in src/ — all application code must use FastAPI"
            exit 1
          fi
          echo "OK: no Flask imports in src/"

      - name: No tracked files matching .gitignore
        run: |
          tracked=$(git ls-files --ignored --cached --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::These tracked files match .gitignore patterns:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no tracked files in .gitignore"

      - name: No disallowed files
        run: |
          bad=$(git ls-files | grep -E '(\.DS_Store|Thumbs\.db|\.bak$|\.swp$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Disallowed files found:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no disallowed files"

      - name: Conventional Commits check (warning only)
        if: github.event_name == 'pull_request'
        run: |
          git log --format="%s" "origin/${{ github.base_ref }}..HEAD" | while read -r msg; do
            if [ -n "$msg" ] && ! echo "$msg" | grep -qE '^(feat|fix|docs|chore|refactor|test|style|ci|perf|build)(\(.+\))?(!)?:'; then
              echo "::warning::Commit does not match Conventional Commits: $msg"
            fi
          done
