name: SonarCloud Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    # The integration suite needs both: Postgres for src/db/, Redis for the rate-limit
    # tests. The same images as tests.yml's integration-tests job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history required for accurate blame information and new code detection
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # QP-6: unit and integration together, so src/db/ is measured by the suite that
      # exercises it rather than excluded. Each run writes its own data file; combine
      # merges them into the one coverage.xml SonarCloud reads.
      - name: Unit tests with coverage
        run: pytest tests/unit/ -q --tb=short -x --cov=src --cov-report=
        env:
          COVERAGE_FILE: .coverage.unit
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ci_test_password
          PG_DB: rag_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          JWT_SECRET_KEY: ci-test-jwt-secret-key
          ADMIN_PASSWORD: ci-test-admin-password
          OLLAMA_BASE_URL: http://localhost:11434
          APP_ENV: development

      - name: Integration tests with coverage
        run: pytest tests/integration/ -m "not ollama" -q --tb=short --cov=src --cov-report=
        env:
          COVERAGE_FILE: .coverage.integration
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: ci_test_password
          PG_DB: rag_db
          SECRET_KEY: ci-test-secret-key-32chars-minimum
          JWT_SECRET_KEY: ci-test-jwt-secret-key
          ADMIN_PASSWORD: ci-test-admin-password
          OLLAMA_BASE_URL: http://localhost:11434
          APP_ENV: development

      - name: Combine coverage
        run: |
          coverage combine .coverage.unit .coverage.integration
          coverage xml -o coverage.xml
          # src/ only: the number SonarCloud shows, since sonar.sources=src.
          coverage report --include="src/*" --format=total | xargs -I{} echo "Combined coverage of src/: {}%" | tee -a "$GITHUB_STEP_SUMMARY"

      # The floor: 2 points under the first honest measurement (85.68% on 2026-10-23),
      # so ordinary variation passes and a real drop does not. Raise it as QP-4 lands;
      # never lower it to clear a red run.
      - name: Coverage floor
        run: coverage report --include="src/*" --fail-under=83.6 > /dev/null

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
