name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  # QP-8: keyless signing and attestations. id-token lets the job prove to Sigstore which
  # workflow built the image; attestations lets it store the SBOM and provenance.
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Tags are set by hand (QP-8, the maintainer's decision), so nothing else ties a tag
      # to the version the code reports. A mismatch stops the release before an image
      # carries the wrong version. test_app_version_is_consistent keeps the three
      # declarations of APP_VERSION equal; this compares the tag to one of them.
      - name: The tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared=$(sed -n "s/^APP_VERSION: str = os.environ.get('APP_VERSION', '\([^']*\)')\r\{0,1\}$/\1/p" src/config.py)
          if [ -z "$declared" ] || [ "${TAG#v}" != "$declared" ]; then
            echo "::error::tag $TAG does not match APP_VERSION '$declared' in src/config.py"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ghcr.io/jwvanderstam/localchat
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # QP-8: everything below acts on the pushed digest, never on a tag, so what is signed
      # and attested is exactly what was built. Verification is in docs/DEPLOYMENT.md.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/jwvanderstam/localchat@${DIGEST}"

      - name: Generate the SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/jwvanderstam/localchat@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest the SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ghcr.io/jwvanderstam/localchat
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/jwvanderstam/localchat
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
