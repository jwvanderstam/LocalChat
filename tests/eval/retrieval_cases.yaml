# Retrieval eval set — DEL-2
#
# Question/expected-source pairs over this repository's own docs/ corpus.
#
# Why this corpus: DEL-2 asks for pairs "over the real document corpus". A
# maintainer's own documents are not available to CI and differ per install,
# so the repo's documentation stands in — it is real prose about a real
# system, ~53k words across 20 files, and it is identical on every machine,
# which is what makes a score comparable between runs. An eval set over your
# own corpus is the natural second one; the harness takes any directory.
#
# `proof` is a literal string that must appear in `source`. It is not used for
# scoring — it is checked before the eval runs, so a pair whose premise has
# rotted fails loudly instead of quietly dragging the score down. Docs get
# rewritten; this set has to notice.
#
# `answered_by` names what the question is really asking for, so a later
# reader can tell an unfair question from a retrieval failure.

